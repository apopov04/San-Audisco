name: Windows build and simulated audio tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install libsodium:x64-windows-static opus:x64-windows-static
      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 "-DSODIUM_ROOT=$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows-static" '-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded$<$<CONFIG:Debug>:Debug>' -DCMAKE_CXX_FLAGS=/DSODIUM_STATIC
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test routing and encrypted loopback audio
        run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: AudioBridge-Windows-x64
          path: |
            build/Release/audiobridge.exe
            build/Release/AudioBridgeApp.exe
